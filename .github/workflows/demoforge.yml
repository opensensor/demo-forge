name: DemoForge CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      flows:
        description: 'Flow names to render (comma-separated)'
        required: false
        default: ''
      heal:
        description: 'Enable heal step on render failure'
        required: false
        default: 'false'
        type: boolean
      matrix:
        description: 'Enable matrix rendering'
        required: false
        default: 'false'
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: which ffmpeg || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

  demoforge:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: which ffmpeg || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render demos
        run: |
          flows="${{ github.event.inputs.flows }}"
          if [ -n "$flows" ]; then
            npx demoforge render $flows
          else
            npx demoforge render
          fi
        shell: bash
        env:
          DEMOFORGE_HEAL: ${{ github.event.inputs.heal || 'false' }}
          DEMOFORGE_MATRIX: ${{ github.event.inputs.matrix || 'false' }}

      - name: Heal broken selectors
        if: ${{ github.event.inputs.heal == 'true' && failure() }}
        run: npx demoforge heal --accept
        shell: bash

      - name: Generate demo site
        run: npx demoforge site
        shell: bash

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: demoforge-assets
          path: .demoforge/output/
          retention-days: 30
