name: DemoForge CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      flows:
        description: 'Flow names to render (comma-separated)'
        required: false
        default: ''
      heal:
        description: 'Enable heal step on render failure'
        required: false
        default: 'false'
        type: boolean
      matrix:
        description: 'Enable matrix rendering'
        required: false
        default: 'false'
        type: boolean

jobs:
  demoforge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20]
        playwright-browser: [chromium]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.playwright-browser }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.playwright-browser }}-
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.playwright-browser }}

      - name: Check ffmpeg
        run: which ffmpeg || sudo apt-get install -y ffmpeg

      - name: Render demos
        run: |
          flows="${{ github.event.inputs.flows }}"
          if [ -n "$flows" ]; then
            demoforge render $flows
          else
            demoforge render
          fi
        shell: bash
        env:
          DEMOFORGE_HEAL: ${{ github.event.inputs.heal || 'false' }}
          DEMOFORGE_MATRIX: ${{ github.event.inputs.matrix || 'false' }}

      - name: Heal broken selectors
        if: ${{ github.event.inputs.heal == 'true' && failure() }}
        run: demoforge heal --accept
        shell: bash

      - name: Generate demo site
        run: demoforge site
        shell: bash

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: demoforge-assets
          path: .demoforge/output/
          retention-days: 30

      - name: Commit and push assets
        if: success()
        run: |
          git config user.name "DemoForge CI"
          git config user.email "ci@demoforge.dev"
          git add .demoforge/output/
          git diff --cached --quiet || git commit -m "chore: update demo assets [skip ci]"
          git push || echo "No changes to push or push failed"
        shell: bash
